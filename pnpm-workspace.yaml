# pnpm 11 ne lit plus le champ `pnpm` de package.json : `overrides` et
# `onlyBuiltDependencies` y sont ignores en silence (avec un avertissement).
# Leur place est ici.
#
# Tant que `overrides` restait dans package.json sans etre repris dans le
# lockfile, toute installation `--frozen-lockfile` echouait sur
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (cas du build Vercel).

overrides:
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
